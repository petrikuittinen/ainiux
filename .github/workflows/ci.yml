name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            python3 \
            valgrind

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Valgrind leak check
        run: make test-leak