name: CI

# Automatic CI is disabled to avoid failure notification emails.
# Run manually from GitHub: Actions → CI → Run workflow.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            python3 \
            valgrind

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Valgrind leak check
        run: make test-leak