# pkchat system-wide defaults
#
# Installed as /etc/xdg/pkchat/config.conf by default. A user config at
# $XDG_CONFIG_HOME/pkchat/config.conf (normally ~/.config/pkchat/config.conf)
# may override individual settings.
#
# This is pkchat's deliberately small TOML-alike format, not full TOML.
# Keep secrets out of this file. Select an environment variable or key file
# under [credentials] instead of storing an API key value here.

config_version = 1
provider = openai
model =
api = chat

[endpoint]
base_url =
chat_url =
models_url =
responses_url =

[generation]
stream = true
# temperature, top_p, and max_output_tokens are intentionally unset so the
# provider/model defaults remain effective.

[context]
window_tokens = 0
max_bytes = 0
policy = error

[network]
connect_timeout_seconds = 10
request_timeout_seconds = 0
proxy =
insecure_tls = false

[credentials]
key_env =
key_file =

[output]
format = text
render_format = md

[input]
max_input_bytes = 1048576
max_image_bytes = 20971520
image_capability = auto
# /insert URL converts UTF-8 HTML to Markdown; set to no to insert raw HTML.
auto-convert-html-to-md = yes

[editor]
undo_limit = 5
huge_file_size_warning = 1073741824
file_size_limit = -1
auto-save-mode = on
auto-save-postfix = "~"
auto-save-threshold = 300
auto-save-timeout = 30
auto-save-size-limit = 10M
# Existing files detect indentation from their first 20 lines; these are fallbacks.
tab-width = 4
tab-style = spaces
linebreak = lf
# Ctrl+Space and /continue context; 0 disables the corresponding side.
continue_prefix_max_chars = 4000
continue_postfix_max_chars = 2000
continue_max_tokens = 32768
# Built-in editor AI commands live in editor-commands.conf (system:
# /etc/xdg/pkchat/editor-commands.conf, user: ~/.config/pkchat/editor-commands.conf).
# Override individual prompts here with assist_behavior, assist_spell, assist_grammar,
# assist_continue, assist_fact, assist_comment, assist_rewrite, assist_english,
# assist_chinese, or assist_finnish, or add/replace commands with repeatable
# [command] blocks (string, modes, prompt). See README.md for examples.

[url_fetch]
max_bytes = 1048576
allow_private_addresses = false

[web_search]
max_results = 3
provider = auto
tavily_key_env = TAVILY_API_KEY
firecrawl_key_env = FIRECRAWL_API_KEY
exa_key_env = EXA_API_KEY
exa_base_url =
searxng_base_url =

[tui]
colors = true
highlight = on
# Built-in themes live in themes.conf (system: /etc/xdg/pkchat/themes.conf,
# user: ~/.config/pkchat/themes.conf). Add or override themes there, then select
# with /theme THEME_NAME in chat or editor mode.
theme = dark
thinking_traces = false

# Repeatable [Model-setting] blocks map model name patterns and purposes to
# sampling defaults. Wildcard suffixes such as Qwen3.6-* are matched when
# purpose-based model selection is wired up. Optional thinking_budget accepts
# either a token count (for example 8192) or a verbal label (for example high).
# The provider layer translates it to the active profile's documented reasoning
# or thinking request fields; custom/local endpoints keep the generic fallback.

[Model-setting]
model = Qwen3.6-*
purpose = creative
default_system_prompt = ""
temperature = 1.0
top_k = 20
top_p = 0.95
min_p = 0.0
repeat_penalty = 1.0
presence_penalty = 0.0

