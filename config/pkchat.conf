# pkchat system-wide defaults
#
# Installed as /etc/xdg/pkchat/config.conf by default. A user config at
# $XDG_CONFIG_HOME/pkchat/config.conf (normally ~/.config/pkchat/config.conf)
# may override individual settings.
#
# This is pkchat's deliberately small TOML-alike format, not full TOML.
# Keep secrets out of this file. Select an environment variable or key file
# under [credentials] instead of storing an API key value here.

config_version = 1
provider = openai
model =
api = chat

[endpoint]
base_url =
chat_url =
models_url =
responses_url =

[generation]
stream = true
# temperature, top_p, and max_output_tokens are intentionally unset so the
# provider/model defaults remain effective.

[context]
window_tokens = 0
max_bytes = 0
policy = error

[network]
connect_timeout_seconds = 10
request_timeout_seconds = 0
proxy =
insecure_tls = false

[credentials]
key_env =
key_file =

[output]
format = text
render_format = md

[input]
max_input_bytes = 1048576
max_image_bytes = 20971520
image_capability = auto

[editor]
undo_limit = 5
huge_file_size_warning = 1073741824
file_size_limit = -1
# assist_behavior = "This is a one-shot editor assist task..."
# assist_spell = "Fix spelling errors only. Do not change wording, grammar, punctuation style, or meaning."
# assist_grammar = "Fix grammar errors only. Do not change wording, spelling where it is already correct, or meaning."
# assist_continue = "Continue the text naturally from where it ends."
# assist_fact = "Fact-check the text and add brief comments about any factual issues you find."

# Custom editor AI commands use repeatable [command] sections. Each block needs
# string, modes, and prompt. Built-in /spell, /grammar, /continue, and /fact
# default to selection, all, insert, and local_insert. Config modes may also
# include continue and fact for custom commands.
# A matching string replaces a built-in command; new strings add commands.
#
# [command]
# string = /example
# modes = all, selection
# prompt = "Output 5 examples of the user-given topic. Answer without any preamble and within <content>...</content> tags."

[url_fetch]
max_bytes = 1048576
allow_private_addresses = false

[tui]
colors = true
theme = dark
thinking_traces = false
