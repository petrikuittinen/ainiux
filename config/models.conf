# ainiux model capability catalog
# Load order: first existing share/development models.conf (see docs/configuration.md),
# then optional user ~/.config/ainiux/models.conf.
#
# `model` is a case-insensitive regular expression matched only against the
# final slash-separated model component. Thus any transport/vendor prefix is
# ignored. Bundled family rules are provider-neutral; user layers may add a
# `provider` field when a transport-specific override is genuinely required.
# `value` is the selector's compact, ordered reasoning-value list. Labels are
# derived from these values, so one family needs only one record.
# Optional `context_window` is a fallback used only when `/models` omits a
# usable context length. Explicit user settings and endpoint metadata win.
# Optional `max_output_tokens` records the provider's documented hard output
# ceiling. It is capability metadata and does not force that request size.
# Optional `temperature_max` is the accepted temperature upper bound for
# /setting and the settings widget (default 1.0; Gemini families use 2.0).
# Optional `images` is the catalog image-input flag: `off` is text-to-text,
# `on` is text-image-to-text. Omitted records keep name-heuristic detection.
# `web_search = on` advertises a hosted search tool when the active adapter can
# emit it. It does not select Chat Completions vs Responses. Only official
# OpenAI defaults to Responses; other providers stay on Chat Completions
# unless `--api responses`, `--responses`, or `openai_responses` is explicit.
config_version = 1

[model]
id = openai-gpt-6-astra
api = any
# Astra does not accept reasoning effort none; Sol and Luna do.
model = "^gpt-6-astra(?:[-.][a-z0-9]+)*$"
value = low|medium|high|xhigh|max
context_window = 1M
max_output_tokens = 128000
priority = 150
reasoning_protocol = openai_effort
temperature = unknown
web_search = on
images = on

[model]
id = openai-gpt-6-sol-luna
api = any
model = "^gpt-6-(?:sol|luna)(?:[-.][a-z0-9]+)*$"
value = none|low|medium|high|xhigh|max
context_window = 1M
max_output_tokens = 128000
priority = 150
reasoning_protocol = openai_effort
temperature = unknown
web_search = on
images = on

[model]
id = openai-gpt-5
api = any
model = "^gpt-5(?:[.][0-9]+)?(?:[-.][a-z0-9]+)*$"
value = none|minimal|low|medium|high|xhigh
priority = 140
reasoning_protocol = openai_effort
temperature = unknown
web_search = on

[model]
id = google-gemini-3
api = chat
model = "^gemini-3(?:[.][0-9]+)?(?:-[a-z0-9]+)*$"
value = minimal|low|medium|high
priority = 120
reasoning_protocol = gemini_effort
temperature = supported
temperature_max = 2.0

[model]
id = google-gemma-4
api = chat
model = "^gemma-4(?:-[a-z0-9]+)*$"
value = none|enabled
priority = 110
reasoning_protocol = gemma_thinking_level
reasoning_default = enabled
temperature = supported

[model]
id = anthropic-claude
api = chat
model = "^claude-(?:fable-5|opus-4(?:[.-]8)|sonnet-5)(?:[-.][a-z0-9]+)*$"
value = 0|1024|8192|16384
priority = 120
reasoning_protocol = anthropic_budget
temperature = supported
web_search = on

[model]
id = anthropic-claude-opus-5
api = chat
# Covers the base Opus 5 alias and dot/dash minor versions or snapshots.
model = "^claude-opus-5(?:[-.][a-z0-9]+)*$"
value = low|medium|high|xhigh|max
context_window = 1M
max_output_tokens = 128000
priority = 130
reasoning_protocol = anthropic_effort
reasoning_default = high
temperature = supported
web_search = on
images = on

[model]
id = anthropic-claude-opus-5.5
api = chat
# Opus 5.5 has the same effort ladder as Opus 5 but defaults to medium.
model = "^claude-opus-5(?:[.-]5)(?:[-.][a-z0-9]+)*$"
value = low|medium|high|xhigh|max
context_window = 1M
max_output_tokens = 128000
priority = 140
reasoning_protocol = anthropic_effort
reasoning_default = medium
temperature = supported
web_search = on
images = on

[model]
id = xai-grok-4
api = any
model = "^grok-4(?:[.][0-9]+)?(?:-[a-z0-9]+)*$"
value = low|medium|high
priority = 120
reasoning_protocol = xai_effort
reasoning_default = high
temperature = supported
web_search = on

[model]
id = deepseek-official-v4
provider = deepseek
api = any
# Since 2026-09-14 the official DeepSeek API serves deepseek-v4-pro and legacy
# deepseek-v4-flash as V4.1-Flash (deepseek-flash), which accepts images.
# Third-party checkpoints keep the text-to-text record below.
model = "^deepseek-v4-(?:pro|flash)(?:[-.](?!vision)[a-z0-9]+)*$"
value = none|low|high|max
context_window = 1M
priority = 125
reasoning_protocol = deepseek
reasoning_default = high
temperature = supported
web_search = on
images = on

[model]
id = deepseek-v4
api = any
# deepseek-v4-pro and dated deepseek-v4-flash revisions on routers and local
# servers. Official DeepSeek API Flash is deepseek-flash (see
# deepseek-v4.1-flash). Exclude -vision- so this text-to-text family does not
# swallow vision ids.
model = "^deepseek-v4-(?:pro|flash)(?:[-.](?!vision)[a-z0-9]+)*$"
value = none|low|high|max
context_window = 1M
priority = 120
reasoning_protocol = deepseek
reasoning_default = high
temperature = supported
web_search = on
images = off

[model]
id = deepseek-v4-flash-vision
api = any
model = "^deepseek-v4-flash-vision(?:-exp)?(?:[-.][a-z0-9]+)*$"
value = none|low|high|max
context_window = 1M
priority = 130
reasoning_protocol = deepseek
reasoning_default = high
temperature = supported
web_search = on
images = on

[model]
id = deepseek-v4.1-flash
api = any
# Official DeepSeek API Flash id is deepseek-flash (V4.1-Flash, multimodal).
# Also match deepseek-v4.1-flash and dated/expires suffixes used by routers.
model = "^deepseek-(?:flash|v4\\.1-flash)(?:[-.][a-z0-9]+)*$"
value = none|low|high|max
context_window = 1M
priority = 130
reasoning_protocol = deepseek
reasoning_default = high
temperature = supported
web_search = on
images = on

[model]
id = moonshot-kimi-k3
api = chat
model = "^kimi-k3(?:-[a-z0-9]+)*$"
value = max
priority = 120
reasoning_protocol = kimi_effort
reasoning_default = max
temperature = supported
web_search = on
web_search_name = $web_search

[model]
id = moonshot-kimi-k2-hybrid
api = chat
# K2.5 and K2.6 use thinking.type, not reasoning_effort. Both default to
# enabled thinking and allow it to be disabled.
model = "^kimi-k2[.](?:5|6)(?:-[a-z0-9]+)*$"
value = none|enabled
priority = 120
reasoning_protocol = thinking_toggle
reasoning_default = enabled
temperature = unsupported
web_search = on
web_search_name = $web_search

[model]
id = zai-glm-5.3-flash
api = chat
# Native multimodal GLM-5.3-Flash. glm-5.3-flashx is the faster serving id for
# the same model. Thinking cannot be disabled.
model = "^glm-5[.]3-flashx?(?:[-.][a-z0-9]+)*$"
value = low|high|max
context_window = 1M
priority = 140
reasoning_protocol = zai
reasoning_default = max
temperature = supported
web_search = on
images = on

[model]
id = zai-glm-5.3
api = chat
# GLM-5.3 is text-to-text. Exclude -flash so this record stays text-only.
# Thinking cannot be disabled; reasoning_effort is low|high|max (default max).
model = "^glm-5[.]3(?:[-.](?!flash)[a-z0-9]+)*$"
value = low|high|max
context_window = 1M
priority = 130
reasoning_protocol = zai
reasoning_default = max
temperature = supported
web_search = on
images = off

[model]
id = zai-glm-5
api = chat
# GLM-5 / 5.1 / 5.2. Exclude 5.3 and 5.3-* (always-on thinking, separate records).
model = "^glm-5(?:[.](?!3(?:$|[-.]))[0-9]+)?(?:-[a-z0-9]+)*$"
value = none|minimal|low|medium|high|xhigh|max
priority = 120
reasoning_protocol = zai
reasoning_default = max
temperature = supported
web_search = on

[model]
id = qwen-3-hybrid-chat
api = chat
model = "^qwen3[.][56](?:-[a-z0-9]+)*$"
value = none|enabled
priority = 120
reasoning_protocol = qwen_chat
reasoning_default = enabled
temperature = supported

[model]
id = qwen-3-hybrid-responses
api = responses
model = "^qwen3[.][56](?:-[a-z0-9]+)*$"
value = none|minimal|low|medium|high|xhigh|max
priority = 125
reasoning_protocol = qwen_responses
reasoning_default = xhigh
temperature = supported

[model]
id = qwen-3.8-flash-next
api = chat
# Qwen3.8-Flash-Next: multimodal, 256K native context (1M optional at the
# endpoint; keep the conservative catalog fallback). Thinking is on by default.
# reasoning_effort is low|medium|xhigh (default xhigh). Catalog none disables
# thinking (instruct / non-thinking mode).
model = "^qwen3[.]8-flash-next(?:[-.][a-z0-9]+)*$"
value = none|low|medium|xhigh
context_window = 262144
priority = 140
reasoning_protocol = qwen_chat_effort
reasoning_default = xhigh
temperature = supported
images = on

[model]
id = qwen-3.8-chat
api = chat
# Exclude flash-next (separate multimodal record above).
model = "^qwen3[.]8(?:-(?!flash-next)[a-z0-9]+)*$"
value = none|low|medium|xhigh
context_window = 262144
priority = 130
reasoning_protocol = qwen_chat_effort
reasoning_default = xhigh
temperature = supported

[model]
id = xiaomi-mimo-v2.6-distill
api = chat
# Local SFT checkpoint. Thinking is the Qwen enable_thinking flag, not the
# Xiaomi API thinking toggle.
model = "^mimo-v2[.]6-distill(?:-[a-z0-9]+)*$"
value = none|enabled
priority = 120
reasoning_protocol = qwen_chat
reasoning_default = enabled
temperature = supported
images = on

[model]
id = xiaomi-mimo-v2.6-chat
api = chat
# API ids mimo-v2.6-pro, mimo-v2.6-flash, and mimo-v2.6-pro-ultraspeed, plus
# the open-weight -rl names. Full-modal, 1M context. Thinking is enabled or
# disabled; temperature is accepted up to 1.5 and forced to 1.0 while thinking.
model = "^mimo-v2[.]6(?:-[a-z0-9]+)*$"
value = disabled|enabled
context_window = 1M
priority = 110
reasoning_protocol = thinking_toggle
reasoning_default = enabled
temperature = supported
temperature_max = 1.5
images = on

[model]
id = xiaomi-mimo-v2.6-responses
api = responses
model = "^mimo-v2[.]6(?:-[a-z0-9]+)*$"
value = none
context_window = 1M
priority = 115
reasoning_protocol = minimax_responses
reasoning_default = none
temperature = supported
temperature_max = 1.5
images = on

[model]
id = xiaomi-mimo-v2-chat
api = chat
# mimo-v2.5 and mimo-v2.5-pro. Both are full-modal and deprecated on the
# Xiaomi API on 2026-10-21.
model = "^mimo-v2[.]5(?:-[a-z0-9]+)*$"
value = disabled|enabled
context_window = 1M
priority = 100
reasoning_protocol = thinking_toggle
reasoning_default = enabled
temperature = supported
temperature_max = 1.5
images = on

[model]
id = xiaomi-mimo-v2-responses
api = responses
model = "^mimo-v2[.]5(?:-[a-z0-9]+)*$"
value = none
context_window = 1M
priority = 105
reasoning_protocol = minimax_responses
reasoning_default = none
temperature = supported
temperature_max = 1.5
images = on

[model]
id = stepfun-step-5
api = chat
# step-5-preview: text, image, and video input. reasoning_effort is
# low|medium|high.
model = "^step-5(?:-[a-z0-9]+)*$"
value = low|medium|high
context_window = 1M
priority = 110
reasoning_protocol = openai_effort
reasoning_default = medium
temperature = supported
images = on

[model]
id = stepfun-step-3-flash
api = chat
model = "^step-3[.]7-flash(?:-[a-z0-9]+)*$"
value = low|medium|high
priority = 100
reasoning_protocol = openai_effort
reasoning_default = medium
temperature = supported

[model]
id = minimax-m3-chat
api = chat
model = "^minimax-m3(?:-[a-z0-9]+)*$"
value = none|adaptive
priority = 100
reasoning_protocol = thinking_toggle
reasoning_default = none
temperature = supported

[model]
id = minimax-m3-responses
api = responses
model = "^minimax-m3(?:-[a-z0-9]+)*$"
value = none|minimal|low|medium|high
priority = 100
reasoning_protocol = minimax_responses
reasoning_default = none
temperature = supported

[model]
id = nvidia-nemotron-3
api = chat
model = "^nemotron-3(?:-[a-z0-9.-]+)*$"
value = none|enabled|16384
priority = 95
reasoning_protocol = nemotron_template
reasoning_default = enabled
temperature = supported

[model]
id = tencent-hy4
api = chat
# hy4-preview. Default reasoning is high; no_think asks for a direct reply.
# Recommended sampling is the general preset.
model = "^hy4(?:-[a-z0-9.]+)*$"
value = no_think|high
context_window = 1M
priority = 100
reasoning_protocol = hy3_template
reasoning_default = high
temperature = supported

[model]
id = tencent-hy3
api = chat
model = "^hy3(?:-[a-z0-9.-]+)*$"
value = no_think|low|high
priority = 95
reasoning_protocol = hy3_template
reasoning_default = no_think
temperature = supported

[model]
id = openai-gpt-oss
api = any
model = "^gpt-oss-(?:20|120)b(?:-[a-z0-9]+)*$"
value = low|medium|high
priority = 100
reasoning_protocol = openai_effort
reasoning_default = medium
temperature = supported

