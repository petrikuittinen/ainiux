# ainiux image-generation catalog
# Load order: bundled share/development images.conf, then optional
# ~/.config/ainiux/images.conf. Later records replace earlier ones by id.
#
# `model` is a case-insensitive regular expression matched against the full
# model id or the final slash-separated component. `protocol` selects a
# compiled HTTP adapter (openai_images, replicate_predictions, fal_queue,
# gemini_interactions). `images = on` in models.conf is vision input, not
# this file.
#
# Replicate, fal, and Gemini records map CLI --size/--ar/--format/--attach
# onto each model's field names. Adding another catalog-compatible image
# (or later video) model should not require new C++.
config_version = 1

[image]
id = openai-gpt-image-2
provider = openai
model = "^gpt-image-2(?:-.*)?$"
api_model = gpt-image-2
protocol = openai_images
default = on
edits = on
max_input_images = 16
size_mode = pixels
size_classes = 1k:1024|2k:2048|4k:3840
size_map = 2k,16:9:2048x1152|4k,16:9:3840x2160|2k,9:16:1152x2048|4k,9:16:2160x3840
max_edge = 3840
min_pixels = 655360
max_pixels = 8294400
max_ratio = 3
multiple = 16
quality = low|medium|high|auto
format = png|jpeg|webp|auto
format_default = png
priority = 100

[image]
id = replicate-z-image-turbo
provider = replicate
model = "^z-image-turbo$"
api_model = prunaai/z-image-turbo
protocol = replicate_predictions
default = on
edits = off
size_mode = pixels
size_classes = 1k:1024|2k:2048
max_edge = 2048
multiple = 8
format = jpg|png|webp
format_default = jpg
width_field = width
height_field = height
format_field = output_format
defaults_json = {"guidance_scale":0,"num_inference_steps":8,"num_outputs":1,"enable_safety_checker":false,"disable_safety_checker":true}
priority = 80

[image]
id = replicate-seedream-5-lite
provider = replicate
model = "^seedream-5-lite$"
api_model = bytedance/seedream-5-lite
protocol = replicate_predictions
edits = on
max_input_images = 14
size_mode = enum
sizes = 2K|3K
size_enum = 2k:2K|4k:3K
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|16:9|9:16|21:9|match_input_image
format = png|jpeg
format_default = png
size_field = size
aspect_field = aspect_ratio
format_field = output_format
images_field = image_input
defaults_json = {"max_images":1,"sequential_image_generation":"disabled","return_byteplus_urls":false}
priority = 70

