# ainiux image-generation catalog
# Load order: bundled share/development images.conf, then optional
# ~/.config/ainiux/images.conf. Later records replace earlier ones by id.
#
# `model` is a case-insensitive regular expression matched only against the
# final slash-separated model component. `protocol` selects a compiled HTTP
# adapter (openai_images, replicate_predictions; fal_queue is reserved).
# `images = on` in models.conf is vision input, not this file.
#
# Replicate records map CLI --size/--ar/--format/--attach onto each model's
# input field names. defaults_json is merged first; adding another Replicate
# image (or later video) model should not require new C++.
config_version = 1

[image]
id = openai-gpt-image-2
provider = openai
model = "^gpt-image-2(?:-.*)?$"
api_model = gpt-image-2
protocol = openai_images
default = on
edits = on
max_input_images = 16
size_mode = pixels
size_classes = 1k:1024|2k:2048|4k:3840
size_map = 2k,16:9:2048x1152|4k,16:9:3840x2160|2k,9:16:1152x2048|4k,9:16:2160x3840
max_edge = 3840
min_pixels = 655360
max_pixels = 8294400
max_ratio = 3
multiple = 16
quality = low|medium|high|auto
format = png|jpeg|webp|auto
format_default = png
priority = 100

[image]
id = replicate-z-image-turbo
provider = replicate
model = "^z-image-turbo$"
api_model = prunaai/z-image-turbo
protocol = replicate_predictions
default = on
edits = off
size_mode = pixels
size_classes = 1k:1024|2k:2048
max_edge = 2048
multiple = 8
format = jpg|png|webp
format_default = jpg
width_field = width
height_field = height
format_field = output_format
defaults_json = {"guidance_scale":0,"num_inference_steps":8,"num_outputs":1,"enable_safety_checker":false,"disable_safety_checker":true}
priority = 80

[image]
id = replicate-seedream-5-lite
provider = replicate
model = "^seedream-5-lite$"
api_model = bytedance/seedream-5-lite
protocol = replicate_predictions
edits = on
max_input_images = 14
size_mode = enum
sizes = 2K|3K
size_enum = 2k:2K|4k:3K
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|16:9|9:16|21:9|match_input_image
format = png|jpeg
format_default = png
size_field = size
aspect_field = aspect_ratio
format_field = output_format
images_field = image_input
defaults_json = {"max_images":1,"sequential_image_generation":"disabled","return_byteplus_urls":false}
priority = 70

[image]
id = replicate-seedream-5-pro
provider = replicate
model = "^seedream-5-pro$"
api_model = bytedance/seedream-5-pro
protocol = replicate_predictions
edits = on
max_input_images = 10
size_mode = enum
sizes = 1K|2K
size_enum = 1k:1K|2k:2K
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|16:9|9:16|21:9|match_input_image
format = png|jpeg
format_default = png
size_field = size
aspect_field = aspect_ratio
format_field = output_format
images_field = image_input
priority = 70

[image]
id = replicate-wan-2.7-image
provider = replicate
model = "^wan-2\\.7-image$"
api_model = wan-video/wan-2.7-image
protocol = replicate_predictions
edits = on
max_input_images = 9
size_mode = enum
sizes = 1K|2K
size_enum = 1k:1K|2k:2K
size_field = size
images_field = images
defaults_json = {"num_outputs":1,"thinking_mode":true,"image_set_mode":false}
priority = 70

[image]
id = replicate-flux-2-flex
provider = replicate
model = "^flux-2-flex$"
api_model = black-forest-labs/flux-2-flex
protocol = replicate_predictions
edits = on
max_input_images = 10
size_mode = enum
sizes = 0.5 MP|1 MP|2 MP|4 MP
size_enum = 1k:1 MP|2k:2 MP|4k:4 MP
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|4:5|5:4|9:16|16:9|21:9|custom|match_input_image
format = webp|jpg|png
format_default = webp
size_field = resolution
aspect_field = aspect_ratio
width_field = width
height_field = height
format_field = output_format
images_field = input_images
defaults_json = {"steps":30,"guidance":4.5,"output_quality":80,"safety_tolerance":5}
priority = 70

[image]
id = replicate-flux-2-pro
provider = replicate
model = "^flux-2-pro$"
api_model = black-forest-labs/flux-2-pro
protocol = replicate_predictions
edits = on
max_input_images = 8
size_mode = enum
sizes = 0.5 MP|1 MP|2 MP|4 MP
size_enum = 1k:1 MP|2k:2 MP|4k:4 MP
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|4:5|5:4|9:16|16:9|21:9|custom|match_input_image
format = webp|jpg|png
format_default = webp
size_field = resolution
aspect_field = aspect_ratio
width_field = width
height_field = height
format_field = output_format
images_field = input_images
defaults_json = {"output_quality":80,"safety_tolerance":5}
priority = 70

[image]
id = replicate-p-image
provider = replicate
model = "^p-image$"
api_model = prunaai/p-image
protocol = replicate_predictions
edits = off
size_mode = aspect
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|4:5|5:4|9:16|16:9|21:9|custom
aspect_field = aspect_ratio
width_field = width
height_field = height
format_default = jpeg
defaults_json = {"disable_safety_checker":true}
priority = 70

[image]
id = replicate-nano-banana-pro
provider = replicate
model = "^nano-banana-pro$"
api_model = google/nano-banana-pro
protocol = replicate_predictions
edits = on
max_input_images = 14
size_mode = enum
sizes = 1K|2K|4K
size_enum = 1k:1K|2k:2K|4k:4K
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|4:5|5:4|9:16|16:9|21:9|match_input_image
format = png|jpg
format_default = png
size_field = resolution
aspect_field = aspect_ratio
format_field = output_format
images_field = image_input
defaults_json = {"safety_filter_level":"block_only_high","allow_fallback_model":false}
priority = 70

[image]
id = replicate-nano-banana-2
provider = replicate
model = "^nano-banana-2$"
api_model = google/nano-banana-2
protocol = replicate_predictions
edits = on
max_input_images = 14
size_mode = enum
sizes = 1K|2K|4K|512px
size_enum = 1k:1K|2k:2K|4k:4K
aspect_ratios = 1:1|2:3|3:2|3:4|4:3|4:5|5:4|9:16|16:9|21:9|1:4|4:1|1:8|8:1|match_input_image
format = jpg|png
format_default = jpg
size_field = resolution
aspect_field = aspect_ratio
format_field = output_format
images_field = image_input
defaults_json = {"image_search":false,"google_search":false}
priority = 70
