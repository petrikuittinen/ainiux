# ainiux video-generation catalog
# Bundled defaults are overlaid by ~/.config/ainiux/videos.conf. Later [video]
# records replace earlier records with the same id. settings_json describes
# scalar controls shared by the CLI, control API, WebUI and provider adapter.
config_version = 1

[video]
id = fal-h3-max-turbo-text
provider = fal
model = "^minimax/h3-max-turbo/text-to-video$"
api_model = minimax/h3-max-turbo/text-to-video
protocol = fal_queue
input_mode = text
default = on
settings_json = [{"name":"duration","label":"Duration","field":"duration","type":"integer","default":5,"min":5,"max":10,"step":1},{"name":"resolution","label":"Resolution","field":"resolution","type":"enum","default":"768P","options":["480P","768P","1080P"]},{"name":"aspect_ratio","label":"Aspect ratio","field":"aspect_ratio","type":"enum","default":"16:9","options":["21:9","16:9","4:3","1:1","3:4","9:16"]},{"name":"seed","label":"Seed","field":"seed","type":"integer"},{"name":"safety_checker","label":"Safety checker","field":"enable_safety_checker","type":"boolean","default":true},{"name":"prompt_expansion","label":"Prompt expansion","field":"prompt_expansion_mode","type":"enum","default":"balanced","options":["balanced","quality"]}]
priority = 100

