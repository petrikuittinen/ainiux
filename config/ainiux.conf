# ainiux system-wide defaults
#
# Installed as /etc/xdg/ainiux/config.conf by default. A user config at
# $XDG_CONFIG_HOME/ainiux/config.conf (normally ~/.config/ainiux/config.conf)
# may override individual settings.
#
# This is ainiux's deliberately small TOML-alike format, not full TOML.
# Keep secrets out of this file. Select an environment variable or key file
# under [credentials] instead of storing an API key value here.

config_version = 1
provider = openai
model =
api = chat

[endpoint]
base_url =
chat_url =
models_url =
responses_url =

[generation]
stream = true
# temperature, top_p, max_output_tokens, and reasoning are intentionally unset
# so provider/model defaults remain effective. reasoning accepts auto, a named
# ASCII value, or an exact non-negative token budget.

[context]
window_tokens = 0
max_bytes = 0
policy = error

[network]
connect_timeout_seconds = 10
request_timeout_seconds = 0
proxy =
insecure_tls = false

[credentials]
key_env =
key_file =

[output]
format = text
render_format = md

[input]
max_input_bytes = 1048576
max_image_bytes = 20971520
image_capability = auto
# /insert URL converts UTF-8 HTML to Markdown; set to no to insert raw HTML.
auto-convert-html-to-md = yes

[index]
# Supported source files larger than this are recorded as skipped.
max_source_code_file_size = 10M

[agent]
max_parallel_agents = 2
security_review_batch_size = 200K
security_review_log_enabled = true
# 0 keeps all completed logs; otherwise the valid range is 1 through 1000.
security_review_log_keep_runs = 3
# File reverse-patch backups under .ainiux-pr/history/ (one slot per path).
history_backup_enabled = true
history_backup_max_bytes = 1M
history_backup_ttl_days = 7
# Auto-compact agent request transcript by context-window percentage.
# When compact_limit is omitted/0: 75 if window > 64k tokens, else 100.
auto_compact = true
# compact_limit = 75
# When true, run_command stdout may appear in the agent transcript (/cmd-out).
show_command_output = false

[media]
# Canonical Markdown attachments at or below this UTF-8 byte size stay in SQLite.
max_size_to_store_to_db = 65536
# /cleanup removes managed attachments unused for this many days.
expiration_days = 7
# Chat startup automatically applies this longer expiration window.
auto_expiration_days = 30

[editor]
undo_limit = 5
huge_file_size_warning = 1073741824
file_size_limit = -1
auto-save-mode = on
auto-save-postfix = "~"
auto-save-threshold = 300
auto-save-timeout = 30
auto-save-size-limit = 10M
# Existing files detect indentation from their first 20 lines; these are fallbacks.
tab-width = 4
tab-style = spaces
linebreak = lf
# Ctrl+Space and /continue context; 0 disables the corresponding side.
# Text and Markdown use the prose limits; other modes use the code limits.
# Configure these here (or via MAX_CONTINUE_* / MAX_AI_CONTINUE_TOKENS env vars);
# there are no CLI flags for them.
continue_prose_prefix_max_chars = 16384
continue_prose_postfix_max_chars = 4096
continue_prefix_max_chars = 4000
continue_postfix_max_chars = 2000
continue_max_tokens = 32768
# Built-in editor AI commands live in editor-commands.conf (system:
# /etc/xdg/ainiux/editor-commands.conf, user: ~/.config/ainiux/editor-commands.conf).
# Override individual prompts here with assist_behavior, assist_spell, assist_grammar,
# assist_continue, assist_fact, assist_comment, assist_rewrite, assist_english,
# assist_chinese, or assist_finnish, or add/replace commands with repeatable
# [command] blocks (string, modes, prompt). See README.md for examples.

[url_fetch]
max_bytes = 1048576
allow_private_addresses = false

[web_search]
max_results = 3
provider = auto
tavily_key_env = TAVILY_API_KEY
firecrawl_key_env = FIRECRAWL_API_KEY
exa_key_env = EXA_API_KEY
exa_base_url =
searxng_base_url =

[tui]
colors = true
highlight = on
# Built-in themes live in themes.conf (system: /etc/xdg/ainiux/themes.conf,
# user: ~/.config/ainiux/themes.conf). Add or override themes there, then select
# with /theme THEME_NAME in chat or editor mode.
theme = dark
thinking_traces = false
# Agent prompt frame cap, including its top and bottom borders (10 through 80).
agent_input_max_height_percent = 25
# Provider-supplied agent reasoning preview, including "Thinking: " and ellipsis.
# 0 disables it; maximum 1000.
agent_thinking_preview_max_chars = 100

# Model capability metadata and purpose presets are layered from models.conf.
