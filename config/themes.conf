# ainiux built-in TUI/editor color themes
#
# Installed as /etc/xdg/ainiux/themes.conf by default. Override individual themes
# or add new ones in $XDG_CONFIG_HOME/ainiux/themes.conf.
#
# Each [theme] block needs name plus the original UI color keys below. The
# syntax_* keys are optional for custom themes; omitted values are derived from
# existing semantic colors with an accessible black/white fallback. Colors use #RRGGBB.
# A matching name replaces a built-in theme; new names add selectable themes.
# Select at runtime with /theme THEME_NAME in chat or editor mode.

[theme]
name = dark
background = #0B0F14
text = #E6EDF3
muted = #9BA7B4
thinking_trace = #A7B8C9
user_label = #7DD3FC
assistant_label = #86EFAC
error = #FCA5A5
status_foreground = #FFFFFF
status_background = #1F2937
thinking_activity = #93C5FD
streaming_activity = #4ADE80
panel_title = #7DD3FC
panel_border = #A8B8CA
panel_hint = #B8C4D4
panel_highlight = #FDE68A
panel_body = #E6EDF3
panel_background = #111722
syntax_comment = #9BA7B4
syntax_keyword = #C4B5FD
syntax_type = #7DD3FC
syntax_string = #86EFAC
syntax_number = #FDE68A
syntax_literal = #FDA4AF
syntax_function = #93C5FD
syntax_variable = #F9A8D4
syntax_operator = #E6EDF3
syntax_preprocessor = #F0ABFC
syntax_tag = #67E8F9
syntax_attribute = #FCD34D
syntax_property = #A5B4FC
syntax_heading = #F9A8D4
syntax_emphasis = #FDBA74
syntax_link = #7DD3FC

