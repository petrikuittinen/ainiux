# pkchat built-in TUI/editor color themes
#
# Installed as /etc/xdg/pkchat/themes.conf by default. Override individual themes
# or add new ones in $XDG_CONFIG_HOME/pkchat/themes.conf.
#
# Each [theme] block needs name plus the color keys below. Colors use #RRGGBB.
# A matching name replaces a built-in theme; new names add selectable themes.
# Select at runtime with /theme THEME_NAME in chat or editor mode.

[theme]
name = dark
background = #0B0F14
text = #E6EDF3
muted = #9BA7B4
thinking_trace = #A7B8C9
user_label = #7DD3FC
assistant_label = #86EFAC
error = #FCA5A5
status_foreground = #FFFFFF
status_background = #1F2937
thinking_activity = #93C5FD
streaming_activity = #4ADE80
panel_title = #7DD3FC
panel_border = #A8B8CA
panel_hint = #B8C4D4
panel_highlight = #FDE68A
panel_body = #E6EDF3
panel_background = #111722

[theme]
name = light
background = #FAFAFA
text = #111827
muted = #4B5563
thinking_trace = #52637A
user_label = #075985
assistant_label = #166534
error = #B91C1C
status_foreground = #111827
status_background = #E5E7EB
thinking_activity = #1D4E8A
streaming_activity = #058630
panel_title = #075985
panel_border = #4B5563
panel_hint = #374751
panel_highlight = #B45309
panel_body = #1F2937
panel_background = #F3F4F6

[theme]
name = sepia
background = #F4ECD8
text = #5B4636
muted = #7A6A58
thinking_trace = #6E5F4D
user_label = #8B5E34
assistant_label = #4F6F46
error = #9B2C2C
status_foreground = #5B4636
status_background = #E8DCC8
thinking_activity = #8B5E34
streaming_activity = #4F6F46
panel_title = #8B5E34
panel_border = #7A6A58
panel_hint = #6E5F4D
panel_highlight = #B7791F
panel_body = #5B4636
