<!doctype html>
<html><head><meta charset="utf-8"><title>DOCX headings and lists</title></head><body>
<h1>Heading One</h1><h2>Heading Two</h2><h3>Heading Three</h3>
<h4>Heading Four</h4><h5>Heading Five</h5><h6>Heading Six</h6>
<blockquote>Quoted paragraph</blockquote>
<ol start="3"><li>Third item</li><li>Fourth item<ul><li>Nested bullet</li></ul></li></ol>
<p><a href="https://example.com/docs">External link</a> and <a href="#target">internal link</a>.</p>
<h2 id="target">Target</h2>
</body></html>
