---
name: pkchat
enabled: true
version: 0.96
released: 2026-07-13

defaults: &defaults
  timeout: 30
  retries: 3
  tags: [terminal, chat, editor]

providers:
  - name: local
    <<: *defaults
    endpoint: "http://127.0.0.1:1234/v1"
  - name: cloud
    enabled: false

description: |
  YAML block scalars preserve newlines.
  They may contain words such as true without becoming booleans.

typed_value: !custom value
optional: null
...

